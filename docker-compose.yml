services:
  app:
    build: .
    env_file: .env
    volumes: ["./data:/app/data"]
    ports: ["8000:8000"]
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/files:/data/files:ro
    ports: ["8080:80"]
    depends_on: [app]
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: ["telegram-local"]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
    volumes: ["./data/telegram-bot-api:/var/lib/telegram-bot-api"]
